<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Supermarket price tracker</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafaf8;
        --fg: #1a1a1a;
        --muted: #6b6b6b;
        --border: #e3e3e0;
        --accent: #2a6f4d;
        --row-hover: #f0efeb;
        --best: #2a6f4d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161614;
          --fg: #ececec;
          --muted: #9a9a9a;
          --border: #2c2c2a;
          --accent: #6fc097;
          --row-hover: #1f1f1d;
          --best: #6fc097;
        }
      }
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
        margin: 0;
        padding: 2rem 1rem 4rem;
        line-height: 1.5;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
      }
      header {
        margin-bottom: 1.5rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.25rem;
      }
      .sub {
        color: var(--muted);
        font-size: 0.9rem;
      }
      .category {
        border-top: 1px solid var(--border);
      }
      .category:last-child {
        border-bottom: 1px solid var(--border);
      }
      .cat-header {
        display: grid;
        grid-template-columns: 1.2rem 1fr auto auto;
        gap: 0.75rem;
        align-items: baseline;
        padding: 0.9rem 0.25rem;
        cursor: pointer;
        user-select: none;
      }
      .cat-header:hover {
        background: var(--row-hover);
      }
      .chevron {
        color: var(--muted);
        font-size: 0.8rem;
        transition: transform 0.15s ease;
        display: inline-block;
      }
      .open .chevron {
        transform: rotate(90deg);
      }
      .cat-name {
        font-weight: 600;
      }
      .cat-best {
        color: var(--best);
        font-weight: 500;
      }
      .cat-total {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-size: 0.9rem;
      }
      .stores {
        display: none;
        padding: 0 0.25rem 1rem 2rem;
      }
      .open .stores {
        display: block;
      }
      .store-row {
        display: grid;
        grid-template-columns: 1.5rem 1fr auto;
        gap: 0.75rem;
        padding: 0.35rem 0;
        font-size: 0.95rem;
        font-variant-numeric: tabular-nums;
      }
      .store-row .rank {
        color: var(--muted);
        text-align: right;
      }
      .store-row.best .store-name {
        color: var(--best);
        font-weight: 600;
      }
      .error {
        color: #c0392b;
        padding: 1rem;
        border: 1px solid #c0392b;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Supermarket price tracker</h1>
        <div class="sub" id="sub"></div>
      </header>
      <div id="list"></div>
    </main>
    <script type="text/csv" id="prices">

    <script>
      const EUR = new Intl.NumberFormat("en-IE", {
        style: "currency",
        currency: "EUR",
      });

      function parseCSV(text) {
        const lines = text.trim().split(/\r?\n/);
        const header = lines[0].split(",");
        const stores = header.slice(2);
        const rows = lines.slice(1).map((line) => {
          const cells = line.split(",");
          const prices = {};
          stores.forEach((s, i) => {
            const v = parseFloat(cells[2 + i]);
            prices[s] = Number.isFinite(v) ? v : null;
          });
          return { category: cells[0], item: cells[1], prices };
        });
        return { stores, rows };
      }

      function groupByCategory({ stores, rows }) {
        const map = new Map();
        for (const row of rows) {
          if (!map.has(row.category)) map.set(row.category, []);
          map.get(row.category).push(row);
        }
        return [...map.entries()].map(([category, items]) => {
          const totals = stores.map((store) => {
            let sum = 0;
            let missing = false;
            for (const item of items) {
              const p = item.prices[store];
              if (p == null) missing = true;
              else sum += p;
            }
            return { store, total: sum, missing };
          });
          totals.sort((a, b) => a.total - b.total);
          return { category, items, totals };
        });
      }

      function render(categories) {
        const list = document.getElementById("list");
        list.innerHTML = "";
        for (const cat of categories) {
          const best = cat.totals[0];
          const el = document.createElement("section");
          el.className = "category";
          el.innerHTML = `
            <div class="cat-header">
              <span class="chevron">▶</span>
              <span class="cat-name">${escapeHtml(cat.category)}</span>
              <span class="cat-best">${escapeHtml(best.store)}</span>
              <span class="cat-total">${EUR.format(best.total)}</span>
            </div>
            <div class="stores">
              ${cat.totals
                .map(
                  (t, i) => `
                    <div class="store-row${i === 0 ? " best" : ""}">
                      <span class="rank">${i + 1}.</span>
                      <span class="store-name">${escapeHtml(t.store)}</span>
                      <span>${EUR.format(t.total)}</span>
                    </div>`
                )
                .join("")}
            </div>
          `;
          el.querySelector(".cat-header").addEventListener("click", () => {
            el.classList.toggle("open");
          });
          list.appendChild(el);
        }
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        })[c]);
      }

      const data = parseCSV(document.getElementById("prices").textContent);
      const categories = groupByCategory(data);
      document.getElementById("sub").textContent =
        `${categories.length} categories · ${data.stores.length} stores · tap a category to rank`;
      render(categories);
    </script>
